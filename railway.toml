[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Note: the uploads volume is NOT declared here. Railway's config-as-code does
# not create volumes -- a [[volumes]] block is silently ignored -- so it lives
# in the Railway template definition instead, mounted at /listmonk/uploads.
